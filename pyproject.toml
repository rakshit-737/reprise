[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "reprise"
version = "0.1.0"
description = "Evidence-bound Kubernetes identity incident investigation"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "REPRISE contributors" }]
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.13,<3",
    "uvicorn>=0.30,<1",
]

[project.scripts]
reprise = "reprise.cli:main"
reprise-snapshot = "reprise.k8s_cli:main"
reprise-audit = "reprise.audit_cli:main"
reprise-sar = "reprise.sar_cli:main"
reprise-history = "reprise.history_cli:main"
reprise-case = "reprise.case_cli:main"
reprise-validate = "reprise.validation_cli:main"
reprise-approve = "reprise.approval_cli:main"

[project.optional-dependencies]
kubernetes = [
    "kubernetes>=32,<38",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=9,<10",
    "ruff>=0.14,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 180

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
